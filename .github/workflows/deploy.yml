
name: Deploy FastAPI to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524414194842:role/GitHubActions-ElasticBeanstalk
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create deployment package
        run: |
          zip -r application.zip app model requirements.txt Procfile

      - name: Upload application version
        run: |
          aws s3 cp application.zip \
            s3://elasticbeanstalk-ap-south-1-${{ secrets.AWS_ACCOUNT_ID }}/customer-churn-${{ github.sha }}.zip

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "Customer_churn_prediction" \
            --version-label "release-${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-ap-south-1-${{ secrets.AWS_ACCOUNT_ID }}",S3Key="customer-churn-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name customerchurnprediction-env \
            --version-label "release-${{ github.sha }}"
